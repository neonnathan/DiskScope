[package]
name = "diskscope"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "DiskScope - a fast, modern disk usage analyzer for Windows"
authors = ["Nathan"]
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
trash = "5.4"
winreg = "0.56"
rfd = "0.15"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
